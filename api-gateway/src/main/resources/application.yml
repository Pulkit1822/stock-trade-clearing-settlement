server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Correlation-ID, ${random.uuid}
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      # Routes: Maps external inbound paths to internal microservices
      routes:
        - id: trade-service
          uri: ${TRADE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/trades/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@principalNameKeyResolver}"

        - id: position-service
          uri: ${POSITION_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/positions/**

        - id: clearing-service
          uri: ${CLEARING_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/clearing/**

        - id: market-integration-gateway
          uri: ${MARKET_GATEWAY_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/market/**

        - id: reference-data-service
          uri: ${REFERENCE_DATA_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/instruments/**, /participants/**, /api/v1/instruments/**, /api/v1/participants/**
          filters:
            - RewritePath=/api/v1/(?<segment>instruments.*|participants.*), /$\{segment}

        - id: corporate-action-service
          uri: ${CORPORATE_ACTION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/corporate-actions/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/notifications/**

  # Redis: distributed token-bucket rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # OAuth2: validates JWT tokens issued by Keycloak before routing requests
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/clearing}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [correlationId=%X{correlationId}] - %msg%n"
  level:
    com.clearing: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework: WARN
