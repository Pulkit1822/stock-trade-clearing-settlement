server:
  port: 8085

spring:
  application:
    name: reference-data-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:clearing}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      pool-name: ReferenceDataServicePool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    repair-on-migrate: true
    table: refdata_flyway_history

  # Redis: cache-aside for instrument and participant lookups
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      # TTL of 10 minutes: instrument data changes infrequently
      time-to-live: 600000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 3
        max.in.flight.requests.per.connection: 1

  security:
    oauth2:
      resourceserver:
        jwt:
          # No issuer-uri: we use a symmetric HS256 key shared with the API Gateway.
          # The JwtDecoder bean is configured programmatically in JwtSecurityConfig.
          secret: ${JWT_SECRET:clearing-platform-jwt-secret-key-that-is-long-enough-for-hs256}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.clearing: INFO
    org.springframework: WARN
