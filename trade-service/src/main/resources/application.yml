server:
  port: 8081

spring:
  application:
    name: trade-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:clearing}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Connection pool tuned for local + moderate production load
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TradeServicePool

  jpa:
    hibernate:
      # validate: Flyway owns all schema changes. Never let Hibernate modify the schema.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: trade
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: trade
    create-schemas: true
    default-schema: trade
    baseline-on-migrate: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Idempotent producer: exactly-once delivery guarantee at the Kafka layer
        enable.idempotence: true
        acks: all
        retries: 3
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: trade-service-settlement
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate
      properties:
        # Whitelist shared event classes for Jackson deserialization
        spring.json.trusted.packages: "com.clearing.shared.events"
        max.poll.records: 100

  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:clearing-platform-jwt-secret-key-that-is-long-enough-for-hs256}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [tradeId=%X{tradeId}] [correlationId=%X{correlationId}] - %msg%n"
  level:
    com.clearing: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN
