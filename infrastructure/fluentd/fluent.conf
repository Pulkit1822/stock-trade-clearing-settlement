# infrastructure/fluentd/fluent.conf
#
# Centralized log collection pipeline:
#   Services (stdout) → Docker fluentd log driver → Fluentd (port 24224)
#                      → Parse JSON → Tag by service name
#                      → Forward to Elasticsearch (index: clearing-logs-YYYY.MM.DD)
#
# All clearing platform services log structured JSON to stdout.
# Docker's fluentd log driver forwards those lines to this config.

#─────────────────────────────────────────────────────────────────────────────
# SOURCE: Accept log records from Docker containers via the forward protocol.
# All containers using the fluentd logging driver send to port 24224.
#─────────────────────────────────────────────────────────────────────────────
<source>
  @type  forward
  port   24224
  bind   0.0.0.0
</source>

#─────────────────────────────────────────────────────────────────────────────
# FILTER: Parse the "log" field as JSON if the record contains structured output.
# Spring Boot services emit JSON structured logs; raw text passes through as-is.
#─────────────────────────────────────────────────────────────────────────────
<filter **>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

#─────────────────────────────────────────────────────────────────────────────
# FILTER: Add a human-readable timestamp to every record.
#─────────────────────────────────────────────────────────────────────────────
<filter **>
  @type record_transformer
  <record>
    hostname      "#{Socket.gethostname}"
    fluentd_tag   ${tag}
  </record>
</filter>

#─────────────────────────────────────────────────────────────────────────────
# OUTPUT: Write all records to Elasticsearch.
#
# Index strategy: daily rolling index → clearing-logs-YYYY.MM.DD
# This makes Kibana index lifecycle management practical.
#
# logstash_format: true  → enables @timestamp field + index date suffix
# include_tag_key: true  → adds the Docker container tag to each document
#─────────────────────────────────────────────────────────────────────────────
<match **>
  @type                    elasticsearch
  host                     elasticsearch
  port                     9200
  scheme                   http
  logstash_format          true
  logstash_prefix          clearing-logs
  logstash_dateformat      %Y.%m.%d
  include_tag_key          true
  tag_key                  container_name
  flush_interval           5s
  reconnect_on_error       true
  reload_on_failure        true
  reload_connections       false
  request_timeout          30s

  # Buffer: write-behind to prevent log loss during Elasticsearch restarts
  <buffer>
    @type                  file
    path                   /fluentd/log/buffer
    flush_mode             interval
    flush_interval         5s
    retry_type             exponential_backoff
    retry_max_interval     30s
    retry_forever          false
    retry_max_times        10
    chunk_limit_size       8MB
    total_limit_size       1GB
    overflow_action        block
  </buffer>
</match>
