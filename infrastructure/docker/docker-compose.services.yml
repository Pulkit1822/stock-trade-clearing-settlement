# infrastructure/docker/docker-compose.services.yml
#
# Optional Docker Compose override for running all Spring microservices in Docker.
# This is separate from docker-compose.yml (infrastructure only) so that
# developers can still run services with IntelliJ/VS Code + local JVM during development.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up
#
# All services use SPRING_PROFILES_ACTIVE=docker to activate JSON logging
# (logback-spring.xml docker profile → LogstashEncoder → Fluentd → Elasticsearch).

version: '3.8'

services:

  trade-service:
    image: clearing/trade-service:latest
    container_name: trade-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clearing
      DB_USERNAME: admin
      DB_PASSWORD: admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      - postgres
      - kafka
      - fluentd
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: "clearing.trade-service"

  position-service:
