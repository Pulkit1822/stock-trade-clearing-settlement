server:
  port: 8084

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:clearing}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      pool-name: NotificationServicePool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: notification

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notification
    create-schemas: true
    default-schema: notification
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    repair-on-migrate: true
    table: notification_flyway_history

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 3
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate
      properties:
        spring.json.trusted.packages: "com.clearing.shared.events"
        max.poll.records: 100

  security:
    oauth2:
      resourceserver:
        jwt:
          # No issuer-uri: we use a symmetric HS256 key shared with the API Gateway.
          # The JwtDecoder bean is configured programmatically in JwtSecurityConfig.
          secret: ${JWT_SECRET:clearing-platform-jwt-secret-key-that-is-long-enough-for-hs256}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [tradeId=%X{tradeId}] [accountId=%X{accountId}] - %msg%n"
  level:
    com.clearing: INFO
    org.springframework: WARN
